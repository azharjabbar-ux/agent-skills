<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%237dd3fc'/%3E%3Ccircle cx='6' cy='8' r='2' fill='%23c4b5fd'/%3E%3Ccircle cx='26' cy='23' r='2.5' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#e8eefc;
    --dim:#8a94ad;
    --edge:rgba(255,255,255,.10);
    --glass:rgba(10,14,26,.72);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;color:var(--ink);overflow:hidden;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block}

  #stars,#glow{position:fixed;inset:0;pointer-events:none}
  #stars{z-index:0}
  #graph{position:fixed;inset:0;z-index:1}
  #glow{z-index:2;mix-blend-mode:screen}

  /* ---------- boot ---------- */
  #boot{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#000;transition:opacity .8s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
  #boot .bar{width:190px;height:1px;background:rgba(255,255,255,.12);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#7dd3fc,transparent);animation:sweep 1.15s infinite}
  @keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
  #boot .err{color:#fca5a5;font-size:12.5px;max-width:440px;text-align:center;line-height:1.6}

  /* ---------- header ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:6;padding:20px 24px;pointer-events:none;
       background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
  #hud h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
  #hud p{margin:5px 0 0;font-size:11.5px;color:var(--dim);letter-spacing:.06em}

  #legend{position:fixed;left:24px;bottom:104px;z-index:6;display:flex;flex-direction:column;gap:7px}
  #legend button{
    display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;cursor:pointer;
    color:var(--dim);font:inherit;font-size:11.5px;letter-spacing:.05em;opacity:.62;transition:opacity .18s,color .18s;
  }
  #legend button:hover,#legend button.on{opacity:1;color:var(--ink)}
  #legend .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 9px currentColor}
  #legend .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:10.5px}

  /* ---------- side panel ---------- */
  #panel{
    position:fixed;top:0;right:0;width:400px;max-width:88vw;height:100%;z-index:8;
    background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-left:1px solid var(--edge);transform:translateX(101%);transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;
  }
  #panel.open{transform:none}
  #panel header{padding:26px 26px 16px;border-bottom:1px solid var(--edge);position:relative;flex:none}
  #panel .grp{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
  #panel .grp .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}
  #panel h3{margin:11px 0 6px;font-size:21px;font-weight:600;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
  #panel .path{font-size:11px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  /* min-height:0 is required: without it a flex child refuses to shrink below
     its content, so on short viewports the excerpt overflows instead of
     scrolling and collides with the section below it. */
  #panel .body{padding:22px 26px 30px;overflow-y:auto;flex:1;min-height:0}
  #panel .body h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
  #panel .excerpt{margin:0 0 28px;color:#c6cfe4;font-size:13.5px;line-height:1.72}
  #panel .links{display:flex;flex-wrap:wrap;gap:7px}
  #panel .links button{
    background:rgba(255,255,255,.05);border:1px solid var(--edge);color:#c6cfe4;
    padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:11.5px;transition:all .18s;
  }
  #panel .links button:hover{background:rgba(255,255,255,.13);color:#fff;transform:translateY(-1px)}
  #close{position:absolute;top:22px;right:22px;width:28px;height:28px;border-radius:50%;
         background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--dim);cursor:pointer;
         font-size:16px;line-height:1;display:grid;place-items:center;transition:all .18s}
  #close:hover{background:rgba(255,255,255,.14);color:#fff}

  /* ---------- chat ---------- */
  #chat{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;width:min(720px,calc(100vw - 48px))}
  #answer{
    margin-bottom:12px;padding:17px 19px;border-radius:14px;border:1px solid var(--edge);
    background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    font-size:13.5px;line-height:1.68;color:#dbe3f5;
    opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none;
    max-height:min(42vh,320px);overflow-y:auto;
  }
  #answer.show{opacity:1;transform:none;pointer-events:auto}
  #answer.err{border-color:rgba(248,113,113,.38);color:#fca5a5}
  #answer .cites{margin-top:13px;padding-top:12px;border-top:1px solid var(--edge);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  #answer .cites span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:3px}
  #answer .cites button{background:rgba(255,255,255,.05);border:1px solid var(--edge);color:#c6cfe4;
    padding:4px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:11px;transition:all .18s}
  #answer .cites button:hover{background:rgba(255,255,255,.14);color:#fff}
  #answer .dots i{display:inline-block;width:5px;height:5px;margin-right:4px;border-radius:50%;
    background:var(--dim);animation:blink 1.3s infinite}
  #answer .dots i:nth-child(2){animation-delay:.18s}
  #answer .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.22}50%{opacity:1}}

  #bar{display:flex;align-items:center;gap:11px;padding:6px 6px 6px 20px;border-radius:999px;
       border:1px solid var(--edge);background:var(--glass);
       backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
       box-shadow:0 12px 44px rgba(0,0,0,.55);transition:border-color .22s,box-shadow .22s}
  #bar:focus-within{border-color:rgba(125,211,252,.44);box-shadow:0 12px 44px rgba(0,0,0,.6),0 0 0 3px rgba(125,211,252,.09)}
  #q{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px;padding:11px 0}
  #q::placeholder{color:#66708a}
  #send{flex:none;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
        background:linear-gradient(145deg,#7dd3fc,#4aa3e8);color:#04121f;font-size:16px;
        display:grid;place-items:center;transition:transform .18s,opacity .18s}
  #send:hover:not(:disabled){transform:scale(1.07)}
  #send:disabled{opacity:.42;cursor:not-allowed}

  /* ---------- voice ---------- */
  #status{display:flex;align-items:center;gap:8px;margin:0 0 9px 6px;min-height:16px;
          font-size:11.5px;letter-spacing:.08em;color:var(--dim);transition:color .25s}
  #status .dot{width:7px;height:7px;border-radius:50%;background:#4b5466;flex:none;transition:all .25s}
  #status .heard{color:#c6cfe4;font-style:italic;letter-spacing:0;opacity:.9}
  #status.listening{color:#fca5a5}
  #status.listening .dot{background:#f87171;box-shadow:0 0 9px #f87171;animation:throb 1.2s ease-in-out infinite}
  #status.thinking{color:#fbbf24}
  #status.thinking .dot{background:#fbbf24;box-shadow:0 0 9px #fbbf24;animation:throb 1.2s ease-in-out infinite}
  #status.speaking{color:#7dd3fc}
  #status.speaking .dot{background:#7dd3fc;box-shadow:0 0 9px #7dd3fc;animation:throb 1.2s ease-in-out infinite}
  #status.muted .dot{background:#4b5466;box-shadow:none}
  @keyframes throb{0%,100%{opacity:1}50%{opacity:.3}}

  #mic{flex:none;width:38px;height:38px;border-radius:50%;cursor:pointer;
       background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--dim);
       display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
  #mic:hover:not(:disabled){background:rgba(255,255,255,.13);color:var(--ink)}
  #mic.on{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.5);color:#fca5a5;
          animation:miclive 1.5s ease-in-out infinite}
  #mic:disabled{opacity:.3;cursor:not-allowed}
  @keyframes miclive{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.35)}50%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}

  @media (max-width:640px){
    #legend{display:none}
    #panel{width:100%}
    #chat{width:calc(100vw - 24px);bottom:14px}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="graph"></div>
<canvas id="glow"></canvas>

<div id="hud">
  <h2>Knowledge Galaxy</h2>
  <p id="hudsub">&nbsp;</p>
</div>

<div id="legend"></div>

<aside id="panel">
  <header>
    <button id="close" title="Close">&times;</button>
    <div class="grp"><span class="dot"></span><span id="pgrp"></span></div>
    <h3 id="ptitle"></h3>
    <div class="path" id="ppath"></div>
  </header>
  <div class="body">
    <h4>Excerpt</h4>
    <p class="excerpt" id="pexcerpt"></p>
    <div id="pnbwrap" hidden>
      <h4>Connected notes</h4>
      <div class="links" id="pnb"></div>
    </div>
  </div>
</aside>

<div id="chat">
  <div id="answer"></div>
  <div id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="statustext">Ready</span>
  </div>
  <form id="bar" autocomplete="off">
    <input id="q" placeholder="Ask your notes anything&hellip;" aria-label="Ask your notes">
    <button id="mic" type="button" title="Speak your question" aria-label="Speak your question">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="21"></line>
      </svg>
    </button>
    <button id="send" type="submit" title="Send">&#8593;</button>
  </form>
</div>

<div id="boot">
  <h1>Mapping the galaxy</h1>
  <div class="bar"><i></i></div>
  <div class="err" id="booterr"></div>
</div>

<!-- 3d-force-graph: CDN first, local vendored copy as an offline fallback. -->
<script src="https://unpkg.com/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<script>
  if (!window.ForceGraph3D) {
    document.write('<script src="vendor/3d-force-graph.min.js"><\/script>');
  }
</script>
<script src="graph-data.js"></script>
<script src="app.js"></script>
</body>
</html>
